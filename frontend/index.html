<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#faf7f2" />
    <!-- The installed counter (#189). The manifest itself is generated by
         vite-plugin-pwa from src/pwa/config.ts; these are the icons a browser
         wants in the document rather than in the manifest. The vector comes
         first: a tab icon is 16px, and a browser that can take an SVG draws the
         mark from the same trace the app wears; the PNG is for the ones that
         cannot. -->
    <link rel="icon" type="image/svg+xml" href="/kdps-mark.svg" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>KDPS Operating System</title>
    <script>
      // No-FOUC: set the theme before first paint. Mirrors src/theme/theme.ts.
      (function () {
        try {
          var p = localStorage.getItem("kdps-theme");
          var dark = p === "dark" || (p !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute("content", dark ? "#201d18" : "#faf7f2");
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
