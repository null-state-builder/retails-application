name: kdps-proof
services:
  database:
    image: postgres:17.11
    env_file: .local/proof-postgres.env
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - proof-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kdps_proof -d kdps_proof"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  proof-postgres:
