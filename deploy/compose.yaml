# KDPS API on one VPS: Postgres + API (with its goods worker, see backend/start.sh)
# + Caddy for HTTPS. The frontend stays on Vercel, whose vercel.json rewrites
# /api/* here, so the browser only ever talks to the Vercel origin.
#
#   cd deploy && cp env.example .env   # fill it in
#   docker compose up -d --build
#
# Only Caddy publishes ports. Postgres and the API are reachable inside this
# compose network only.
name: kdps

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: kdps
      POSTGRES_USER: kdps
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kdps -d kdps"]
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    build: ../backend
    restart: unless-stopped
    # Railway ran migrate as a pre-deploy step; here it runs before each start.
    command: ["sh", "-c", "python manage.py migrate --noinput && exec sh start.sh"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://kdps:${POSTGRES_PASSWORD}@db:5432/kdps
      DJANGO_DEBUG: "0"
      # 127.0.0.1 is for the container's own health check; the port is not published.
      DJANGO_ALLOWED_HOSTS: ${DOMAIN:?set DOMAIN in deploy/.env},127.0.0.1
      # Browsers send the Vercel origin (Vercel proxies /api here).
      CSRF_TRUSTED_ORIGINS: ${FRONTEND_ORIGIN:?set FRONTEND_ORIGIN in deploy/.env},https://${DOMAIN}
      CORS_ALLOWED_ORIGINS: ${FRONTEND_ORIGIN}
      KDPS_COOKIE_SECURE: "1"
      KDPS_OFFBOX_ROOT: /data/offbox
    volumes:
      - appdata:/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  pgdata:
  appdata:
  caddy_data:
  caddy_config:
